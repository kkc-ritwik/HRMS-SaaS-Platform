apiVersion: v1
kind: ServiceAccount
metadata:
  name: hrms-app
  labels: { app.kubernetes.io/part-of: hrms }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hrms-app
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hrms-app
subjects:
  - kind: ServiceAccount
    name: hrms-app
roleRef:
  kind: Role
  name: hrms-app
  apiGroup: rbac.authorization.k8s.io
