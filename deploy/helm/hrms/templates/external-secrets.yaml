{{- if .Values.externalSecrets.enabled }}
# Requires external-secrets-operator + a ClusterSecretStore named {{ .Values.externalSecrets.secretStore }}
# Map every Kubernetes Secret used by the chart to a key in AWS Secrets Manager / Vault / GCP Secret Manager.

{{- $store := .Values.externalSecrets.secretStore }}
{{- $prefix := .Values.externalSecrets.prefix }}

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-db }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target:
    name: hrms-db
    creationPolicy: Owner
  data:
    - { secretKey: username, remoteRef: { key: {{ $prefix }}db, property: username } }
    - { secretKey: password, remoteRef: { key: {{ $prefix }}db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-jwt }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: hrms-jwt, creationPolicy: Owner }
  data:
    - { secretKey: secret, remoteRef: { key: {{ $prefix }}jwt, property: signingKey } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-storage }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: hrms-storage, creationPolicy: Owner }
  data:
    - { secretKey: accessKey, remoteRef: { key: {{ $prefix }}storage, property: accessKey } }
    - { secretKey: secretKey, remoteRef: { key: {{ $prefix }}storage, property: secretKey } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-smtp }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: hrms-smtp, creationPolicy: Owner }
  data:
    - { secretKey: host,     remoteRef: { key: {{ $prefix }}smtp, property: host     } }
    - { secretKey: username, remoteRef: { key: {{ $prefix }}smtp, property: username } }
    - { secretKey: password, remoteRef: { key: {{ $prefix }}smtp, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-twilio }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: hrms-twilio, creationPolicy: Owner }
  data:
    - { secretKey: accountSid, remoteRef: { key: {{ $prefix }}twilio, property: accountSid } }
    - { secretKey: authToken,  remoteRef: { key: {{ $prefix }}twilio, property: authToken  } }
    - { secretKey: fromNumber, remoteRef: { key: {{ $prefix }}twilio, property: fromNumber } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-fcm }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: hrms-fcm, creationPolicy: Owner }
  data:
    - { secretKey: serviceAccountJson, remoteRef: { key: {{ $prefix }}fcm, property: serviceAccountJson } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: hrms-backup }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: hrms-backup, creationPolicy: Owner }
  data:
    - { secretKey: bucket,     remoteRef: { key: {{ $prefix }}backup, property: bucket     } }
    - { secretKey: region,     remoteRef: { key: {{ $prefix }}backup, property: region     } }
    - { secretKey: s3Endpoint, remoteRef: { key: {{ $prefix }}backup, property: s3Endpoint } }
    - { secretKey: accessKey,  remoteRef: { key: {{ $prefix }}backup, property: accessKey  } }
    - { secretKey: secretKey,  remoteRef: { key: {{ $prefix }}backup, property: secretKey  } }
{{- end }}
