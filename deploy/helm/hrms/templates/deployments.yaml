{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }}, app.kubernetes.io/part-of: hrms }
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "{{ $svc.port }}"
    spec:
      containers:
        - name: app
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports: [{ containerPort: {{ $svc.port }} }]
          env:
            - name: PORT
              value: "{{ $svc.port }}"
            {{- include "hrms.commonEnv" $ | nindent 12 }}
          resources:
            requests: { cpu: {{ $svc.cpu | quote }}, memory: {{ $svc.memory | quote }} }
            limits:   { cpu: {{ $svc.cpu | quote }}, memory: {{ $svc.memory | quote }} }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ $svc.port }} }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ $svc.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app: {{ $name }} }
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      name: http
{{- end }}
