name: Security scan

on:
  push:
    branches: [main, HRMSSAAS]
  schedule:
    - cron: '0 4 * * 1'   # weekly Monday 4am UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: java }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B -ntp -DskipTests=true package
      - uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        continue-on-error: true          # a DB-pull/rate-limit blip must not red the pipeline
        env:
          # Pull the vuln DBs from the AWS ECR mirror to avoid ghcr anonymous rate limits
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'                 # report findings, don't fail the job on them
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with: { sarif_file: trivy-fs.sarif }

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do NOT run actions/setup-java here. This action executes inside its own
      # Docker container with a bundled JDK; a host JAVA_HOME (from setup-java)
      # leaks into the container and points at /opt/hostedtoolcache/... which does
      # not exist there, so the container's java cannot start ("JAVA_HOME is not
      # defined correctly"). Letting the container use its own JDK fixes it.
      - uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true          # tolerate NVD data / infra hiccups
        with:
          project: hrms
          path: '.'
          format: 'SARIF'
          args: --failOnCVSS 9
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        with: { sarif_file: reports/dependency-check-report.sarif }

  secrets-leak:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
