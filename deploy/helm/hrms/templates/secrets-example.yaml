{{- if .Values.bootstrapSecrets.enabled }}
# ⚠ DEV-ONLY: minimal in-cluster secrets so the chart deploys without ExternalSecrets.
#   Use values-prod.yaml with externalSecrets.enabled=true to source from Vault/AWS SM.
#   These contain placeholder values — rotate immediately after first install.

apiVersion: v1
kind: Secret
metadata: { name: hrms-db }
type: Opaque
stringData:
  username: hrms_user
  password: {{ .Values.bootstrapSecrets.dbPassword | default "CHANGEME-DB-PASSWORD" | quote }}
---
apiVersion: v1
kind: Secret
metadata: { name: hrms-jwt }
type: Opaque
stringData:
  secret: {{ .Values.bootstrapSecrets.jwtSecret | default "CHANGEME-JWT-SIGNING-KEY-256-BITS" | quote }}
---
apiVersion: v1
kind: Secret
metadata: { name: hrms-storage }
type: Opaque
stringData:
  accessKey: {{ .Values.bootstrapSecrets.storageAccessKey | default "minioadmin" | quote }}
  secretKey: {{ .Values.bootstrapSecrets.storageSecretKey | default "minioadmin" | quote }}
{{- end }}
