{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: hrms
    app.kubernetes.io/version: {{ $.Values.global.imageTag | quote }}
    app.kubernetes.io/managed-by: helm
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: hrms
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ $svc.managementPort | default 8081 | quote }}
        sidecar.istio.io/inject: {{ $.Values.istio.enabled | default false | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: hrms-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: {{ $name }} }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: {{ $name }} }
      containers:
        - name: app
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - { containerPort: {{ $svc.port }}, name: http }
            - { containerPort: {{ $svc.managementPort | default 8081 }}, name: management }
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: MANAGEMENT_PORT
              value: {{ $svc.managementPort | default 8081 | quote }}
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            {{- include "hrms.commonEnv" $ | nindent 12 }}
          envFrom:
            - configMapRef: { name: hrms-config }
            - secretRef:    { name: hrms-secrets, optional: true }
          resources:
            requests: { cpu: {{ $svc.cpu | quote }}, memory: {{ $svc.memory | quote }} }
            limits:   { cpu: {{ $svc.cpuLimit | default $svc.cpu | quote }}, memory: {{ $svc.memoryLimit | default $svc.memory | quote }} }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh","-c","sleep 15"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workdir, mountPath: /workdir }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: workdir, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: hrms
spec:
  type: ClusterIP
  selector: { app: {{ $name }} }
  ports:
    - port: {{ $svc.port }}
      targetPort: http
      name: http
    - port: {{ $svc.managementPort | default 8081 }}
      targetPort: management
      name: management
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.replicas }}
  maxReplicas: {{ $svc.maxReplicas | default (mul $svc.replicas 3) }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 4, periodSeconds: 30 }
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  {{- if gt (int $svc.replicas) 1 }}
  minAvailable: 1
  {{- else }}
  maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels: { app: {{ $name }} }
{{- end }}
