# ─── PRODUCTION PROFILE ────────────────────────────────────────────────────
# Shipped by common-observability — auto-applied when SPRING_PROFILES_ACTIVE=prod
# Every service that has common-observability on its classpath picks this up.
#
# Override per-service with application-prod-<service>.yml or env vars.
# ────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        connection.provider_disables_autocommit: true
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ${spring.application.name}-pool
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
        linger.ms: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 100
      properties:
        session.timeout.ms: 45000
        max.poll.interval.ms: 300000
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      missing-topics-fatal: false
  cloud:
    discovery:
      client:
        health-indicator:
          include-description: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 20
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20s
    keep-alive-timeout: 60s
    max-keep-alive-requests: 100

management:
  server:
    port: ${MANAGEMENT_PORT:8081}      # separate port — keep ops traffic off the public listener
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,threaddump,heapdump,scheduledtasks,caches,httpexchanges,mappings,refresh
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redisLatency,kafka
        liveness:
          include: livenessState,diskSpace,ping
  prometheus:
    metrics:
      export:
        enabled: true
        step: 30s

logging:
  level:
    root: INFO
    com.hrms: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.cloud.gateway: INFO
    org.apache.kafka.clients: WARN
  pattern:
    correlation: '[${spring.application.name:},%X{requestId:-},%X{tenantId:-}]'

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://service-discovery:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      version: ${IMAGE_TAG:1.0.0}
      region: ${REGION:default}
      zone: ${AZ:default}

hrms:
  resilience:
    ratelimit:
      enabled: true
      requests-per-minute: ${HRMS_RATELIMIT_RPM:600}
    idempotency:
      enabled: true
      ttl-seconds: 86400
  security:
    headers:
      hsts-max-age: 63072000
      csp: "default-src 'self'; frame-ancestors 'none'; object-src 'none'"

# OpenTelemetry exporter — Tempo / Jaeger / Honeycomb compatible
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}
      protocol: http/protobuf
  service:
    name: ${spring.application.name}
  resource:
    attributes:
      service.namespace: hrms
      deployment.environment: ${ENVIRONMENT:prod}
