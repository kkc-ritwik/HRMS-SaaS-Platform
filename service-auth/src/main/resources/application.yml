server:
  port: 8081

spring:
  application:
    name: service-auth

  # ── Database ─────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/hrms_db
    username: ${DB_USERNAME:hrms_user}
    password: ${DB_PASSWORD:hrms_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  # ── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    table: flyway_schema_history_auth
    baseline-on-migrate: true
    baseline-version: 0

  # ── Redis ────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: 1
    consumer:
      group-id: service-auth-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hrms.*"

  # ── Mail (SMTP — defaults to MailHog for local dev) ──────────────────────────
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: false
          connectiontimeout: 5000
          timeout: 5000
    test-connection: false

# ── Eureka Discovery ─────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:hrms-platform-jwt-secret-key-change-this-in-production-256bit!!}
  access-token-expiry: 3600000     # 1 hour in ms
  refresh-token-expiry: 604800000  # 7 days in ms

# ── App-level settings ────────────────────────────────────────────────────────
app:
  otp:
    expiry-minutes: 5
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 30
    max-sessions: 3

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── HRMS shared library config ───────────────────────────────────────────────
hrms:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from-address: ${MAIL_FROM:noreply@hrms.local}
    from-name: ${MAIL_FROM_NAME:HRMS}
    async-send: true
    retry-attempts: 3
    bcc-audit-address: ${MAIL_BCC_AUDIT:}
  security:
    password:
      min-length: ${HRMS_PWD_MIN_LENGTH:10}
      max-age-days: ${HRMS_PWD_MAX_AGE_DAYS:90}
      history-lookback: ${HRMS_PWD_HISTORY:5}
    lockout:
      max-failed-attempts: ${HRMS_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-minutes: ${HRMS_LOCKOUT_MINUTES:15}
  resilience:
    ratelimit:
      enabled: ${HRMS_RATELIMIT_ENABLED:true}
      requests-per-minute: ${HRMS_RATELIMIT_RPM:300}

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.hrms: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
