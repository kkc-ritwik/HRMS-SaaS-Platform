name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - service-discovery
          - config-server
          - service-auth
          - service-core-hr
          - service-leave-attendance
          - service-payroll
          - service-recruitment
          - service-compensation
          - service-performance
          - service-onboarding
          - service-offboarding
          - service-expense
          - service-asset
          - service-document
          - service-workflow
          - service-notification
          - service-compliance
          - service-reports
          - service-social
          - service-lms
          - service-helpdesk
          - service-travel
          - service-timesheet
          - service-cases
          - service-files
          - service-forms
          - service-engagement
          - service-skills
          - service-integrations
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Deploy via Helm
        run: |
          echo "Deploying tag ${{ github.ref_name }} to production cluster"
          # helm upgrade --install hrms ./deploy/helm/hrms \
          #   --set global.imageTag=${{ github.ref_name }} \
          #   --namespace hrms --create-namespace
